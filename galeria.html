<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeria de Fotos</title>
<style>
  :root { --bg: #f6f3ee; --fg: #2b2622; --card: #fff; --muted: #7a7068; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1a18; --fg: #eee8e2; --card: #2a2724; --muted: #a59a90; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: Georgia, "Times New Roman", serif; }
  header { text-align: center; padding: 40px 16px 16px; }
  h1 { margin: 0; font-weight: normal; font-size: 2.2rem; }
  header p { color: var(--muted); margin: 8px 0 0; font-family: system-ui, sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
          gap: 20px; padding: 24px 16px 48px; max-width: 1200px; margin: 0 auto; }
  figure { margin: 0; background: var(--card); padding: 10px 10px 6px; border-radius: 4px;
           box-shadow: 0 2px 10px rgba(0,0,0,.12); cursor: zoom-in;
           transition: transform .2s; }
  figure:hover { transform: translateY(-3px); }
  figure img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
  figcaption { font-family: system-ui, sans-serif; font-size: .8rem; color: var(--muted);
               padding: 6px 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none;
              align-items: center; justify-content: center; z-index: 10; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 92vw; max-height: 86vh; box-shadow: 0 0 30px #000; }
  #lightbox .cap { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center;
                   color: #ddd; font-family: system-ui, sans-serif; font-size: .9rem; }
  #lightbox button { position: absolute; background: none; border: 0; color: #fff;
                     font-size: 2.6rem; cursor: pointer; padding: 12px 18px; opacity: .8; }
  #lightbox button:hover { opacity: 1; }
  .close { top: 4px; right: 8px; } .prev { left: 4px; } .next { right: 4px; }
</style>
</head>
<body>
<header>
  <h1>Galeria de Fotos</h1>
  <p id="count"></p>
</header>
<main class="grid" id="grid"></main>

<div id="lightbox">
  <button class="close" aria-label="Fechar">&times;</button>
  <button class="prev" aria-label="Anterior">&#8249;</button>
  <img alt="">
  <button class="next" aria-label="Próxima">&#8250;</button>
  <div class="cap"></div>
</div>

<script>
const fotos = [
  "0911 E SHOPPING 020.jpg",
  "1811 014.jpg",
  "FB_IMG_1790272776143.jpg",
  "FB_IMG_1790272816073.jpg",
  "IMG_20231216_082634_662.jpg",
  "IMG_20231216_082634_665.jpg",
  "Screenshot_20260924_145956_Facebook.jpg",
  "bombeiro 009.jpg",
  "casamento Le 046.jpg",
  "fevereiro 2011 010.jpg"
];

const grid = document.getElementById("grid");
document.getElementById("count").textContent = fotos.length + " fotos";
fotos.forEach((nome, i) => {
  const fig = document.createElement("figure");
  fig.innerHTML = `<img loading="lazy" src="${encodeURI(nome)}" alt=""><figcaption></figcaption>`;
  fig.querySelector("figcaption").textContent = nome.replace(/\.[^.]+$/, "");
  fig.onclick = () => abrir(i);
  grid.appendChild(fig);
});

const lb = document.getElementById("lightbox");
const lbImg = lb.querySelector("img");
const lbCap = lb.querySelector(".cap");
let atual = 0;
function abrir(i) {
  atual = (i + fotos.length) % fotos.length;
  lbImg.src = encodeURI(fotos[atual]);
  lbCap.textContent = `${atual + 1} / ${fotos.length} — ${fotos[atual]}`;
  lb.classList.add("open");
}
function fechar() { lb.classList.remove("open"); }
lb.querySelector(".close").onclick = fechar;
lb.querySelector(".prev").onclick = e => { e.stopPropagation(); abrir(atual - 1); };
lb.querySelector(".next").onclick = e => { e.stopPropagation(); abrir(atual + 1); };
lb.onclick = e => { if (e.target === lb) fechar(); };
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") fechar();
  if (e.key === "ArrowLeft") abrir(atual - 1);
  if (e.key === "ArrowRight") abrir(atual + 1);
});
</script>
</body>
</html>
